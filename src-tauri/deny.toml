# cargo-deny licence gate for all crates, including transitive dependencies.
# This mirrors licenses/policy.toml; tests keep both lists in sync.

[graph]
all-features = false

[licenses]
# Anything outside this list fails the build.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unlicense",
    "CC0-1.0",
    "0BSD",
    "MPL-2.0",          # Exception described below
    "Unicode-3.0",      # unicode-ident and related crates
    "BSL-1.0",          # Permissive Boost Software License
]
confidence-threshold = 0.9

# MPL-2.0 is file-level copyleft without effect on surrounding code. It enters
# through webpki-roots and related crates. The notice belongs in
# THIRD-PARTY-NOTICES.md but does not block distribution.
[[licenses.clarify]]
name = "webpki-roots"
expression = "MPL-2.0"
license-files = []

[bans]
# Crates forbidden by name. There are none yet because Tauri's Rust tree is
# consistently MIT/Apache-2.0. Keep this section ready for future changes.
multiple-versions = "allow"
wildcards = "deny"
deny = []

[advisories]
# Security advisories fail the build. A known dependency flaw is not a reason
# to continue building.
yanked = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
