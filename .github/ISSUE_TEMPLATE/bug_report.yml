name: Bug report
description: Something does not work as described.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Never attach real documents.** Invoices, forms and scans contain
        personal and business data. Reproduce the problem with a synthetic
        file (`npm run corpus`) or describe the layout in words.
        Security problems, especially data leaving the machine, belong in a
        private report: see SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the synthetic file corpus/out/...
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Commit or version
      placeholder: git rev-parse --short HEAD
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [Linux, WSL2, Windows, macOS]
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Operating mode
      options: [Air-gap (default), On-premise, Cloud, not sure]
  - type: textarea
    id: logs
    attributes:
      label: Log excerpt
      description: Logs contain no document content by design. Check anyway before pasting.
      render: text
