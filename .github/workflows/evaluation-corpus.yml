name: Evaluation corpus

on:
  pull_request:
    paths:
      - 'corpus/evaluation/**'
      - '.gitattributes'
      - '.github/workflows/evaluation-corpus.yml'
  push:
    branches: [main]
    paths:
      - 'corpus/evaluation/**'
      - '.gitattributes'
      - '.github/workflows/evaluation-corpus.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: LFS objects
        run: git lfs fsck
      - name: Scoring and dataset integrity (offline)
        run: python -m unittest discover -s corpus/evaluation/v1 -p 'test_*.py' -v
      - name: Archived report integrity and independent scoring
        run: python corpus/evaluation/reports/2026-10-14/tools/verify_report.py
      - name: Corrected report and original 16 regressions
        run: python corpus/evaluation/reports/2026-10-14-corrected/tools/verify_report.py
