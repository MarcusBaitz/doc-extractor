name: CI

on:
  push:
    branches: [main]
  pull_request:

# These gates enforce the product's two promises. A failure is a violation of
# a customer-facing property rather than a formatting issue.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The sidecar cannot download at runtime, including in CI.
  HF_HUB_OFFLINE: '1'
  TRANSFORMERS_OFFLINE: '1'

jobs:
  sidecar:
    name: Sidecar (Python)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Dependencies
        working-directory: sidecar
        run: uv sync --all-groups --frozen

      - name: Linting
        working-directory: sidecar
        run: uv run ruff check substrakt/

      - name: Generate test corpus
        working-directory: sidecar
        run: uv run python ../corpus/generate.py

      - name: Tests
        working-directory: sidecar
        run: uv run pytest ../tests/sidecar/ -v

      - name: Benchmark (performance budgets)
        working-directory: sidecar
        run: uv run python ../bench/run.py -n 3

  frontend:
    name: Frontend (TypeScript)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Linting
        run: npm run lint

      # Check coordinate conversion against the same fixture as Python. This
      # step fails if the implementations diverge.
      - name: Tests
        run: npm test

  shell:
    name: Shell (Rust)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev \
            libdbus-1-dev

      - name: Format
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        working-directory: src-tauri
        run: cargo test

  licenses:
    name: Licence gates
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable

      - run: npm ci
      - name: Python dependencies
        working-directory: sidecar
        run: uv sync --all-groups --frozen

      # Check runtime and development dependencies separately against
      # licenses/policy.toml. Shipped code must be on the allowlist, while a
      # test tool under MPL-2.0 is not distributed.
      - name: Python and npm
        run: python3 scripts/check-licenses.py

      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: src-tauri/Cargo.toml
          command: check licenses bans sources

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          format: cyclonedx-json
          artifact-name: substrakt-sbom.cyclonedx.json

  egress:
    name: Egress chokepoint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      # Enforce the core promise: no network access outside
      # src-tauri/src/egress.rs, even if a linter rule is disabled in source.
      - name: Grep gate
        run: bash scripts/check-egress.sh

  # TODO stage 4: start the built application in a sandbox without a network
  # route and run a complete extraction. Any network request in Air-gap mode
  # fails the test. This requires the finished installer and belongs to stage 4.
